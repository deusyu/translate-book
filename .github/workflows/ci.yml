name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python Checks
    # Pinned, not ubuntu-latest: apt on this image installs Pandoc 3.1.3 and zsh 5.9,
    # and a newer image would change the Pandoc the tests run against.
    runs-on: ubuntu-24.04
    env:
      PYTHONPYCACHEPREFIX: .pycache
      # Tests that need one of these fail, instead of skipping, when it is missing.
      TRANSLATE_BOOK_REQUIRED_TOOLS: pandoc zsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pandoc and zsh
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pandoc zsh
          pandoc --version
          zsh --version

      - name: Verify Python sources compile
        run: python -m compileall scripts tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
